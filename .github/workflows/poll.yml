name: poll

on:
  schedule:
    # Three entries, one 4-hour grid, no overlaps. GitHub fires the workflow
    # once per matching cron entry, so two entries that share a minute queue a
    # duplicate run against the concurrency group and bill it twice - which is
    # why the off-hours grid below skips 09/13/17 on weekdays instead of using
    # a plain `0 */4`.
    #
    # GitHub does not fire cron punctually, and more importantly it does not
    # fire every entry at all. Measured over 29 hours on the previous
    # schedule: 13.9 runs a day delivered against 29 scheduled - 48%, with a
    # median gap of 59 minutes against a nominal 30. Nothing is wrong; the
    # scheduler drops fires under load. So the cadence below is what is asked
    # for, not what arrives, and the two differ by about half.
    #
    # That is also why the budget looks comfortable. At the delivery rate we
    # actually see this is ~880-1,040 billed minutes a month; if GitHub ever
    # became punctual the same schedule would cost ~1,825-2,170, at or over the
    # 2,000 allowance. `make eval` warns above 1,200 projected, which is
    # deliberately just above the expected figure - it trips when delivery
    # improves rather than after the bill.
    #
    # `timezone` is a real field as of March 2026. Before that these had to be
    # hand-offset from UTC, which drifted an hour twice a year. Spring-forward
    # skips 02:00-03:00 local and GitHub advances a skipped slot to the next
    # valid time; nothing here is scheduled in that hour.

    # Everything below is offset to :05 rather than :00. Simplify's bot commits
    # listings.json at :01 and :31 past the hour, every 30 minutes, and it is
    # the largest feed here. Polling on the hour meant arriving a minute before
    # the new data every time, so anything it published waited a full cycle.
    #
    # 08:00-12:00 America/Los_Angeles, every 15 minutes. Buying back the
    # 30-minute effective cadence in the hours that produce most of the US
    # postings, where a delivery rate of one in two hurts most. Deliberately
    # not applied to the whole window: `*/15` across 06:00-19:00 would cost
    # ~2,700 billed minutes a month if GitHub ever delivered all of it.
    # :05 and :35 still line up with Simplify; :20 and :50 sample the others.
    - cron: "5,20,35,50 8-11 * * 1-5"
      timezone: America/Los_Angeles

    # The rest of the working day, every 30 minutes. Hours are disjoint from
    # the band above, which is what keeps two entries off the same minute.
    - cron: "5,35 6-7,12-18 * * 1-5"
      timezone: America/Los_Angeles
    - cron: "5 19 * * 1-5"
      timezone: America/Los_Angeles

    # Weekday off-hours: every 4 hours, continuing the grid from 19:00.
    # 03:00 rather than 01:00 on purpose - 01:00-02:00 local occurs twice on
    # the fall-back night, and 02:00-03:00 does not exist on spring-forward.
    - cron: "0 3,23 * * 1-5"
      timezone: America/Los_Angeles

    # Weekends, the same 4-hour grid all day. Friday 23:00 hands off to
    # Saturday 03:00 and Sunday 23:00 to Monday 03:00, so neither boundary
    # leaves a seam.
    - cron: "0 3,7,11,15,19,23 * * 6,0"
      timezone: America/Los_Angeles

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A late run must never overlap the next one and race on the export.
  group: jobpipe-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The job reads no history, only the tip. Full history is ~8 MB of
          # clone for nothing, and `git push` works fine from a shallow clone.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The one piece of state carried between runs. Without it every run
      # starts with an empty ETag table, so nothing is ever a conditional
      # request: ~12 MB of Simplify listings plus 71 ATS boards re-downloaded
      # and 16k raw reqs re-parsed each time, purely to rediscover that
      # nothing changed. The exact key never hits, so every run saves a fresh
      # entry and `restore-keys` picks up the most recent one.
      - uses: actions/cache@v6
        with:
          path: data/http-cache.db
          key: jobpipe-http-cache-${{ github.run_id }}
          restore-keys: |
            jobpipe-http-cache-

      - run: pip install -e . --disable-pip-version-check

      - name: Run pipeline
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          # Both unset means no mirror, which is not an error. The pipeline
          # writes columns A-H of the Live tab and nothing else, ever.
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          # ANTHROPIC_API_KEY is deliberately absent. Scoring runs
          # heuristic-only; add the secret here to enable the LLM path.
        run: python -m jobpipe.cli run

      # The minute budget is the constraint now, so make it observable without
      # opening the run. Step durations are in the UI; what is not is how much
      # of the job was the pipeline and how much was setup.
      - name: Budget summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/run-report.json")
          if not p.exists():
              print("no run report"); raise SystemExit
          r = json.loads(p.read_text())
          d = r["duration_s"]
          print(f"### Pipeline {d:.1f}s  ·  {r['baseline_size']} baseline  ·  new {sum(s['new'] for s in r['sources'])}\n")
          print("| source | ms | 304 | raw | new |")
          print("|---|--:|:--:|--:|--:|")
          for s in r["sources"]:
              print(f"| {s['name']} | {s['latency_ms']} | {'yes' if s['not_modified'] else 'no'} "
                    f"| {s['raw_fetched']} | {s['new']} |")
          fetch = sum(s["latency_ms"] for s in r["sources"]) / 1000
          print(f"\nfetch {fetch:.1f}s · everything else {d - fetch:.1f}s "
                f"· links checked {sum(r['links'].values())}")
          PY

      # Failures only. Uploading a 7 MB database on every green run is ~20
      # seconds of the budget and 300+ MB/day of retention to hold artifacts
      # nobody opens. On a red run it is the whole picture.
      - name: Upload replay payloads
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: replay-${{ github.run_id }}
          path: |
            data/postings.db
            logs/*.jsonl
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit state, only if it changed
        run: |
          git config user.name  "jobpipe[bot]"
          git config user.email "jobpipe@users.noreply.github.com"
          # One path at a time, guarded. `git add` aborts the entire step on a
          # pathspec that matches nothing - it does not skip it and carry on -
          # and some of these are produced conditionally: sheet-status.json
          # only exists once the Sheets mirror is configured. Listing it
          # unconditionally took the workflow down for four hours.
          for path in data/postings.jsonl data/baseline.txt data/run-report.json \
                      data/sheet-status.json data/audit \
                      INDEX.md INDEX-by-score.md; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          # An all-304 run produces a byte-identical export. No diff, no commit -
          # which is what keeps the history readable.
          if git diff --cached --quiet; then
            echo "no change; skipping commit"
            exit 0
          fi
          git commit -m "poll: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      # The dead-man's switch is pinged inside `jobpipe run`, which answers
      # "did the pipeline run" - not "did the workflow succeed". So when the
      # commit step failed on every run for four hours, healthchecks.io stayed
      # green throughout and the only signal was GitHub's failure email. An
      # explicit /fail turns a red workflow into the same alarm as a missed
      # ping, immediately rather than after the grace period.
      #
      # The secret goes through `env` rather than into the `if:`. The `secrets`
      # context is not dependable in a step-level condition, and this file has
      # already shipped one untested workflow change today.
      - name: Alarm on failure
        if: failure()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL/fail" || true
          fi
