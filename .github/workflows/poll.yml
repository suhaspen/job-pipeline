name: poll

on:
  schedule:
    # Nominal 30 minutes. GitHub does not fire cron punctually: 5-30 minutes
    # late is routine and there is no SLA, so treat 30-60 as the realistic p50.
    # Do not go below this - the platform floor is 5 minutes, the free-tier
    # guidance is 15, and the GitHub-sourced feeds only update daily.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A late run must never overlap the next one and race on the export.
  group: jobpipe-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Run pipeline
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          # ANTHROPIC_API_KEY is deliberately absent. Scoring runs
          # heuristic-only; add the secret here to enable the LLM path.
        run: python -m jobpipe.cli run

      - name: Upload replay payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-${{ github.run_id }}
          path: |
            data/postings.db
            logs/*.jsonl
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit state, only if it changed
        run: |
          git config user.name  "jobpipe[bot]"
          git config user.email "jobpipe@users.noreply.github.com"
          git add data/postings.jsonl data/baseline.txt data/run-report.json INDEX.md
          # An all-304 run produces a byte-identical export. No diff, no commit -
          # which is what keeps the history readable.
          if git diff --cached --quiet; then
            echo "no change; skipping commit"
            exit 0
          fi
          git commit -m "poll: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
