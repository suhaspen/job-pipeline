name: digest

on:
  schedule:
    # 07:00 America/Los_Angeles. The timezone field handles DST; hand-offsetting
    # UTC would drift by an hour twice a year.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Send daily digest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m jobpipe.cli digest
