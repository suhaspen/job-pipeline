name: digest

on:
  schedule:
    # 07:00 America/Los_Angeles. The `timezone` field is what makes that true:
    # the comment used to claim it while the entry was a bare `0 7 * * *`, so
    # the digest was firing at 07:00 UTC - midnight PT - and the tier 2 roundup
    # landed while the phone was face down. Hand-offsetting instead would drift
    # an hour at each DST boundary.
    - cron: "0 7 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . --disable-pip-version-check
      - name: Send daily digest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m jobpipe.cli digest
