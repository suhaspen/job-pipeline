[project]
name = "jobpipe"
version = "0.1.0"
description = "Low-latency polling pipeline for co-op and new-grad SWE/AI-ML postings"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "freezegun>=1.5",
]

[project.scripts]
jobpipe = "jobpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that require network access (deselected by default)",
]
