[project]
name = "jobpipe"
version = "0.1.0"
description = "Low-latency polling pipeline for co-op and new-grad SWE/AI-ML postings"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
    # Credentials only. The Sheets API calls themselves are plain `requests`,
    # like every other HTTP client here: google-api-python-client would add a
    # discovery layer and a second HTTP stack for four endpoints. ~32 MB
    # installed, ~4s cold and near zero against the workflow's pip cache.
    "google-auth>=2.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "freezegun>=1.5",
]

[project.scripts]
jobpipe = "jobpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that require network access (deselected by default)",
]
